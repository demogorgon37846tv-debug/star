<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 5 Leaderboard - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Neue', cursive;
            background: linear-gradient(135deg, #6ecbf5 0%, #e3f2fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #2c3e50;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            background: linear-gradient(90deg, #3498db, #e74c3c, #f1c40f, #2ecc71, #9b59b6);
            border-radius: 10px 10px 0 0;
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-family: 'Baloo 2', cursive;
            font-size: 2.5rem;
            color: #3498db;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }

        .login-header p {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .login-form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #2c3e50;
        }

        .form-control {
            width: 100%;
            padding: 15px;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            font-family: 'Comic Neue', cursive;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.3);
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #7f8c8d;
        }

        .input-icon .form-control {
            padding-left: 45px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-family: 'Comic Neue', cursive;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary {
            background: #3498db;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .btn-secondary:hover {
            background: #7f8c8d;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .login-footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }

        .login-footer a {
            color: #3498db;
            text-decoration: none;
            font-weight: 700;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #e74c3c;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .success-message {
            background: #2ecc71;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .demo-accounts {
            margin-top: 25px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
        }

        .demo-accounts h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .demo-accounts p {
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #7f8c8d;
        }

        @media (max-width: 500px) {
            .login-container {
                padding: 30px 20px;
            }
            
            .login-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Grade 5 Leaderboard</h1>
            <p>Sign in to access the student leaderboard</p>
        </div>
        
        <div id="error-message" class="error-message">
            <i class="fas fa-exclamation-circle"></i> Invalid username or password
        </div>
        
        <div id="success-message" class="success-message">
            <i class="fas fa-check-circle"></i> Login successful! Redirecting...
        </div>
        
        <form class="login-form" id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" class="form-control" placeholder="Enter your username" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>
        
        <div class="demo-accounts">
            <h3>Demo Accounts:</h3>
            <p><strong>Teacher:</strong> teacher / password</p>
            <p><strong>Admin:</strong> admin / admin123</p>
        </div>
        
        <div class="login-footer">
            <p>Need an account? <a href="#" id="register-link">Contact administrator</a></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize demo accounts if they don't exist
            initializeDemoAccounts();
            
            // Get form and message elements
            const loginForm = document.getElementById('login-form');
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');
            const registerLink = document.getElementById('register-link');
            
            // Handle form submission
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Get input values
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                // Validate credentials
                if (validateCredentials(username, password)) {
                    // Show success message
                    errorMessage.style.display = 'none';
                    successMessage.style.display = 'block';
                    
                    // Create user session
                    createUserSession(username);
                    
                    // Redirect to leaderboard after a brief delay
                    setTimeout(function() {
                        window.location.href = 'leaderboard.html';
                    }, 1000);
                } else {
                    // Show error message
                    successMessage.style.display = 'none';
                    errorMessage.style.display = 'block';
                    
                    // Shake animation for error
                    loginForm.style.animation = 'shake 0.5s';
                    setTimeout(function() {
                        loginForm.style.animation = '';
                    }, 500);
                }
            });
            
            // Register link handler
            registerLink.addEventListener('click', function(e) {
                e.preventDefault();
                alert('Please contact the system administrator to create a new account.');
            });
            
            // Check if user is already logged in
            checkExistingSession();
        });
        
        // Initialize demo accounts
        function initializeDemoAccounts() {
            const users = JSON.parse(localStorage.getItem('grade5Users')) || [];
            
            // Add demo accounts if they don't exist
            if (!users.find(user => user.username === 'teacher')) {
                users.push({
                    username: 'teacher',
                    password: 'password',
                    role: 'teacher',
                    displayName: 'Teacher Account'
                });
            }
            
            if (!users.find(user => user.username === 'admin')) {
                users.push({
                    username: 'admin',
                    password: 'admin123',
                    role: 'admin',
                    displayName: 'Administrator'
                });
            }
            
            localStorage.setItem('grade5Users', JSON.stringify(users));
        }
        
        // Validate user credentials
        function validateCredentials(username, password) {
            const users = JSON.parse(localStorage.getItem('grade5Users')) || [];
            const user = users.find(u => u.username === username && u.password === password);
            return user !== undefined;
        }
        
        // Create user session
        function createUserSession(username) {
            const users = JSON.parse(localStorage.getItem('grade5Users')) || [];
            const user = users.find(u => u.username === username);
            
            if (user) {
                const session = {
                    username: user.username,
                    displayName: user.displayName,
                    role: user.role,
                    isAuthenticated: true,
                    loginTime: new Date().getTime()
                };
                
                localStorage.setItem('currentUser', JSON.stringify(session));
                return true;
            }
            
            return false;
        }
        
        // Check for existing session
        function checkExistingSession() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            
            if (currentUser && currentUser.isAuthenticated) {
                // Check if session is still valid (less than 8 hours old)
                const eightHours = 8 * 60 * 60 * 1000;
                if (new Date().getTime() - currentUser.loginTime < eightHours) {
                    // Redirect to leaderboard
                    window.location.href = 'leaderboard.html';
                } else {
                    // Clear expired session
                    localStorage.removeItem('currentUser');
                }
            }
        }
    </script>
</body>
</html>
